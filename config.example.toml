# miosotis configuration (~/.miosotis/config.toml, or $MIOSOTIS_HOME/config.toml). All keys are optional.

# Library folder (database + managed files). Keep it on a local disk, not in a live-synced
# folder such as OneDrive or iCloud; use [backup].dir for cloud copies instead.
# Relative paths resolve against the miosotis home folder.
# data_dir = "~/.miosotis/data"

[user]
# Preferred reply language for AI hosts (BCP-47: en, zh-CN, ja, …). Unset: follow the language you write in.
# Saved text is never translated.
# language = "en"

# IANA timezone used to interpret dates such as "today". Defaults to the system timezone.
# timezone = "Europe/Berlin"

[backup]
# Default destination for `miosotis backup create` (a cloud-synced folder is fine here).
# dir = "~/OneDrive/miosotis-backups"

[enrich]
# Opt-in background enrichment of new notes. Set it up with `miosotis enrich worker enable --provider codex`
# rather than by hand: it checks Codex, runs a test, and writes these keys.
# worker = "codex"
# codex_path = "/absolute/path/to/codex"
# model = "<model>"            # optional; Codex's default otherwise
# reasoning_effort = "low"     # minimal | low | medium | high
